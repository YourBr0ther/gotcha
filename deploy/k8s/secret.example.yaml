# Copy to secret.yaml, fill in, apply, and keep the filled copy out of git
# (or encrypt it with sops or sealed-secrets, whichever the cluster uses).
# Every key here is read by the app or by one of the other manifests.
apiVersion: v1
kind: Secret
metadata:
  name: gotcha-secrets
  namespace: gotcha
type: Opaque
stringData:
  # Used by postgres-deployment.yaml, and must match the password inside
  # DATABASE_URL. The host is the Service name in postgres-service.yaml.
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgres://gotcha:change-me@gotcha-postgres:5432/gotcha

  # NanoGPT (OpenAI-compatible). GOTCHA_MODEL_TICK decides what a pokemon does
  # on its own; GOTCHA_MODEL_TALK answers the trainer. Either may be left
  # empty to fall back to GOTCHA_MODEL, and all three empty uses the built-in
  # default. Without an API key the rules engine runs alone and nothing talks.
  NANOGPT_API_KEY: ""
  NANOGPT_BASE_URL: https://nano-gpt.com/api/v1
  GOTCHA_MODEL_TICK: ""
  GOTCHA_MODEL_TALK: ""
  GOTCHA_MODEL: ""

  # Shared with rollover-cronjob.yaml. Any long random string.
  ROLLOVER_TOKEN: change-me

  # ed25519 private key for signing .cpkmn exports, base64. Generate with
  # `pnpm tsx scripts/keygen.ts`. The key id travels inside every exported
  # file so another install can tell whose signature it is checking.
  CPKMN_SIGNING_KEY: ""
  CPKMN_KEY_ID: "home#2026-10"
  # Optional: JSON object of keyId to public key for other installs whose
  # files this one should trust on import.
  CPKMN_KNOWN_KEYS: ""

  # Optional. Real weather for the diorama from Open-Meteo, no key needed.
  OPEN_METEO_LAT: ""
  OPEN_METEO_LON: ""
  # Optional. An OpenAI-style /audio/transcriptions endpoint for voice input.
  # Unset, the app tries NANOGPT_BASE_URL/audio/transcriptions.
  GOTCHA_STT_URL: ""
