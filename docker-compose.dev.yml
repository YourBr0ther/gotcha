# Local Postgres for development and the trainer-api test suite.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gotcha
      POSTGRES_PASSWORD: gotcha
      POSTGRES_DB: gotcha
    ports:
      - "5434:5432"
    volumes:
      - gotcha-pg:/var/lib/postgresql/data
volumes:
  gotcha-pg:
